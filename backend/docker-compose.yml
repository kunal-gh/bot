version: '3.8'

services:
  bot-api:
    build: .
    container_name: bot-api
    command: uvicorn bot.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DUCKDB_PATH=:memory:
    volumes:
      - ./data:/app/data

  bot-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bot-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://bot-api:8000
    depends_on:
      - bot-api

  # Legacy Streamlit UI (kept for backward compat)
  bot-ui:
    build: .
    container_name: bot-ui
    command: streamlit run bot/ui/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BOT_API_URL=http://bot-api:8000
    depends_on:
      - bot-api

name: 🤖 BOT — CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Backend Tests & Lint
  # ─────────────────────────────────────────
  backend-test:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run unit tests
        env:
          OPENAI_API_KEY: "dummy-key-for-testing"
          LLM_PROVIDER: "openai"
        run: |
          python -m pytest bot/tests/unit/ -v --tb=short \
            --junitxml=reports/junit-unit.xml

      - name: 📊 Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/reports/

  # ─────────────────────────────────────────
  # 2. Frontend Type Check & Build
  # ─────────────────────────────────────────
  frontend-build:
    name: ⚡ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend deps
        working-directory: frontend
        run: npm install

      - name: 🔨 Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "https://alluring-grace-production-c441.up.railway.app"
        run: npm run build

      - name: ✅ Build succeeded
        run: echo "Frontend build passed!"

  # ─────────────────────────────────────────
  # 3. Docker Build Validation
  # ─────────────────────────────────────────
  docker-validate:
    name: 🐳 Docker Validate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build backend Docker image
        working-directory: backend
        run: docker build -t bot-api:ci .

      - name: ✅ Docker build succeeded
        run: echo "Backend Docker image builds cleanly!"

  # ─────────────────────────────────────────
  # 4. Deploy Summary
  # ─────────────────────────────────────────
  deploy-status:
    name: 🚀 Deploy Status
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🎉 All checks passed
        run: |
          echo "=================================="
          echo "✅ All CI checks passed!"
          echo "🚂 Railway will auto-deploy from main"
          echo "=================================="
          echo "Backend:  https://bot-api-production-7ddf.up.railway.app"
          echo "Frontend: Railway will deploy frontend/ as second service"
